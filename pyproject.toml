[project]
name = "cityprior"
version = "0.1.0"
description = "Infrastructure-derived location memory as a prior for autonomous driving: a proof of concept on real infrastructure-camera trajectories."
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
